<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI情报官 · 全球AI洞察</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS Variables ─────────────────────────────────────────── */
    :root {
      --bg-primary: #0a0b0f;
      --bg-secondary: #111318;
      --bg-card: #161921;
      --bg-card-hover: #1c2029;
      --bg-glass: rgba(22, 25, 33, 0.8);
      --border: rgba(255,255,255,0.07);
      --border-accent: rgba(99, 102, 241, 0.3);
      --text-primary: #f0f2f7;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --accent-2: #8b5cf6;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --pink: #ec4899;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 8px 48px rgba(0,0,0,0.7);
    }

    /* ── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

    /* ── Animated background ───────────────────────────────────── */
    .bg-gradient {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(139,92,246,0.06) 0%, transparent 60%);
    }

    /* ── Header ────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,11,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; gap: 20px;
      height: 64px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 0 16px var(--accent-glow);
    }
    .logo-text {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    .header-meta {
      display: flex; align-items: center; gap: 16px;
      margin-left: auto; font-size: 12px; color: var(--text-muted);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px;
      background: rgba(99,102,241,0.12);
      border: 1px solid var(--border-accent);
      color: #a5b4fc; font-size: 12px; font-weight: 500;
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: rgba(99,102,241,0.22); }
    .refresh-btn.spinning .icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main Layout ───────────────────────────────────────────── */
    main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

    /* ── Daily Digest Hero ──────────────────────────────────────── */
    .digest-section { margin-bottom: 36px; }
    .digest-card {
      background: linear-gradient(135deg, rgba(22,25,33,0.9) 0%, rgba(26,28,46,0.9) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(99,102,241,0.1);
    }
    .digest-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .digest-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      background: rgba(99,102,241,0.15);
      border: 1px solid var(--border-accent);
      font-size: 11px; font-weight: 600; color: #a5b4fc;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .digest-headline {
      font-size: 22px; font-weight: 700;
      line-height: 1.4; margin-bottom: 14px;
      color: var(--text-primary);
    }
    .digest-summary {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.8; margin-bottom: 24px;
    }
    .digest-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .digest-module {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
    }
    .digest-module-title {
      font-size: 11px; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .trend-item {
      display: flex; gap: 10px; margin-bottom: 10px;
      padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .trend-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .trend-num {
      width: 20px; height: 20px; border-radius: 6px;
      background: rgba(99,102,241,0.2); color: var(--accent);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .trend-text { font-size: 13px; }
    .trend-name { font-weight: 600; margin-bottom: 2px; }
    .trend-desc { color: var(--text-secondary); font-size: 12px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 3px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      font-size: 11px; color: var(--text-secondary);
    }
    .market-signal {
      font-size: 13px; color: var(--text-secondary); line-height: 1.7;
    }
    .signal-badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 600;
      margin-right: 6px;
    }
    .signal-positive { background: rgba(16,185,129,0.15); color: var(--green); }
    .signal-caution { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .signal-negative { background: rgba(239,68,68,0.15); color: var(--red); }

    /* ── Section Header ─────────────────────────────────────────── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .section-title {
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .count-badge {
      padding: 2px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      font-size: 12px; font-weight: 500; color: var(--text-muted);
    }

    /* ── Filters ────────────────────────────────────────────────── */
    .filters {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .filter-tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 4px;
    }
    .tab-btn {
      padding: 6px 14px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
      color: var(--text-muted); transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .tab-btn:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.06); }

    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 14px;
    }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text-primary); font-size: 13px; width: 180px;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-icon { color: var(--text-muted); font-size: 14px; }

    /* ── Tweet Cards Grid ───────────────────────────────────────── */
    .tweets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .tweet-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .tweet-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.25s;
      background: radial-gradient(ellipse at top left, rgba(99,102,241,0.05), transparent 60%);
    }
    .tweet-card:hover {
      border-color: var(--border-accent);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .tweet-card:hover::after { opacity: 1; }

    /* Importance indicator */
    .tweet-card.importance-high { border-left: 3px solid var(--accent); }
    .tweet-card.importance-medium { border-left: 3px solid rgba(99,102,241,0.4); }
    .tweet-card.importance-low { border-left: 3px solid var(--border); }

    .card-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: white;
    }
    .avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .avatar img.error { display: none; }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-title {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .category-badge {
      padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .cat-scientist { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .cat-founder { background: rgba(139,92,246,0.15); color: #c4b5fd; }
    .cat-opinion_leader { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .cat-podcast { background: rgba(245,158,11,0.15); color: #fcd34d; }

    .tweet-text {
      font-size: 13px; color: var(--text-secondary);
      line-height: 1.7; margin-bottom: 14px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .divider {
      height: 1px; background: var(--border);
      margin: 14px 0;
    }

    .summary-label {
      font-size: 10px; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .summary-text {
      font-size: 13px; color: var(--text-primary);
      line-height: 1.7;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
    .card-tag {
      padding: 2px 8px; border-radius: 20px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      font-size: 10px; color: #a5b4fc;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px;
    }
    .engagement {
      display: flex; gap: 14px; font-size: 12px; color: var(--text-muted);
    }
    .eng-item { display: flex; align-items: center; gap: 4px; }
    .tweet-time { font-size: 11px; color: var(--text-muted); }
    .open-link {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--accent);
      padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border-accent);
      transition: all 0.2s;
    }
    .open-link:hover { background: rgba(99,102,241,0.1); }

    /* ── Loading & Empty States ──────────────────────────────────── */
    .loading-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .skeleton {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px; height: 260px;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { opacity: 0.5; }
    }

    .empty-state {
      text-align: center; padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }

    /* ── Stats Bar ───────────────────────────────────────────────── */
    .stats-bar {
      display: flex; gap: 20px; padding: 16px 24px;
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border); margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; align-items: center; gap: 8px; }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-divider { width: 1px; background: var(--border); align-self: stretch; }

    /* ── Toast ───────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--bg-card); border: 1px solid var(--border-accent);
      border-radius: var(--radius-sm); padding: 12px 20px;
      font-size: 13px; color: var(--text-primary);
      box-shadow: var(--shadow-lg);
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { padding: 20px 16px; }
      .tweets-grid { grid-template-columns: 1fr; }
      .header-meta .date-text { display: none; }
      .digest-grid { grid-template-columns: 1fr; }
      .search-box input { width: 120px; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">🔭</div>
        <div>
          <div class="logo-text">AI情报官</div>
          <div class="logo-sub">Global AI Insights Tracker</div>
        </div>
      </div>

      <div class="header-meta">
        <div class="status-dot"></div>
        <span class="date-text" id="headerDate"></span>
        <span id="lastUpdated" style="display:none"></span>
        <button class="refresh-btn" onclick="refreshData()" id="refreshBtn">
          <span class="icon">↻</span>
          <span>刷新数据</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat-item">
        <div class="stat-value" id="statTweets">–</div>
        <div class="stat-label">条推文</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="statInfluencers">–</div>
        <div class="stat-label">位追踪人物</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="statEngagement">–</div>
        <div class="stat-label">总互动量</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="statDigests">–</div>
        <div class="stat-label">期洞察报告</div>
      </div>
    </div>

    <!-- Daily Digest -->
    <section class="digest-section">
      <div id="digestContainer">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Tweet Feed -->
    <section>
      <div class="section-header">
        <div class="section-title">
          📡 实时追踪
          <span class="count-badge" id="tweetCount">...</span>
        </div>
        <div class="filters">
          <div class="filter-tabs" id="filterTabs">
            <button class="tab-btn active" data-cat="all" onclick="filterByCategory('all', this)">全部</button>
            <button class="tab-btn" data-cat="scientist" onclick="filterByCategory('scientist', this)">科学家</button>
            <button class="tab-btn" data-cat="founder" onclick="filterByCategory('founder', this)">创始人</button>
            <button class="tab-btn" data-cat="opinion_leader" onclick="filterByCategory('opinion_leader', this)">意见领袖</button>
            <button class="tab-btn" data-cat="podcast" onclick="filterByCategory('podcast', this)">播客</button>
          </div>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="搜索推文或人物..." id="searchInput" oninput="filterBySearch()" />
          </div>
        </div>
      </div>

      <div id="tweetsContainer">
        <!-- Loading skeletons -->
        <div class="loading-grid" id="loadingSkeletons">
          ${Array(6).fill('<div class="skeleton"></div>').join('')}
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────
    const state = {
      tweets: [],
      filteredTweets: [],
      currentCategory: 'all',
      searchQuery: '',
      loading: false,
    };

    // ── Utilities ──────────────────────────────────────────────────
    const API = (path) => `/api${path}`;

    function fmtNumber(n) {
      if (!n) return '0';
      if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '';
      const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
      return Math.floor(diff / 86400) + '天前';
    }

    function getInitials(name) {
      return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }

    // ── Category color map ─────────────────────────────────────────
    const CAT_LABEL = {
      scientist: '科学家', founder: '创始人',
      opinion_leader: '意见领袖', podcast: '播客'
    };

    // ── Render Daily Digest ────────────────────────────────────────
    function renderDigest(d) {
      if (!d) return '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">暂无今日洞察</div></div>';

      const trends = (d.top_trends || []).map((t, i) => `
        <div class="trend-item">
          <div class="trend-num">${i+1}</div>
          <div class="trend-text">
            <div class="trend-name">${t.trend}</div>
            <div class="trend-desc">${t.description}</div>
          </div>
        </div>`).join('');

      const watchItems = (d.watch_list || []).map(w => `<span class="tag">${w}</span>`).join('');
      const debates = (d.hot_debates || []).map(w => `<span class="tag">${w}</span>`).join('');

      const sig = d.market_signal || '';
      const isPos = sig.includes('积极');
      const isCau = sig.includes('谨慎') || sig.includes('混合');
      const sigClass = isPos ? 'signal-positive' : isCau ? 'signal-caution' : 'signal-negative';
      const sigText = isPos ? '积极' : isCau ? '谨慎' : '消极';

      return `
        <div class="digest-card">
          <div class="digest-badge">🗞 ${d.date || '今日'} · AI每日洞察</div>
          <h1 class="digest-headline">${d.headline || '今日AI洞察'}</h1>
          <p class="digest-summary">${d.executive_summary || ''}</p>
          <div class="digest-grid">
            ${trends ? `
            <div class="digest-module">
              <div class="digest-module-title">📈 今日趋势</div>
              ${trends}
            </div>` : ''}
            ${watchItems ? `
            <div class="digest-module">
              <div class="digest-module-title">👀 关注列表</div>
              <div class="tag-list">${watchItems}</div>
            </div>` : ''}
            ${debates ? `
            <div class="digest-module">
              <div class="digest-module-title">💬 热议话题</div>
              <div class="tag-list">${debates}</div>
            </div>` : ''}
            ${sig ? `
            <div class="digest-module">
              <div class="digest-module-title">📊 市场信号</div>
              <p class="market-signal"><span class="signal-badge ${sigClass}">${sigText}</span>${sig.replace(/^(积极|谨慎|消极|混合)\s*[—–-]\s*/,'')}</p>
            </div>` : ''}
          </div>
        </div>`;
    }

    // ── Render Tweet Card ──────────────────────────────────────────
    function renderTweetCard(item) {
      const { influencer: inf, tweet, analysis } = item;
      const importance = analysis?.importance || 'medium';
      const summary = analysis?.summary_zh || '';
      const tags = (analysis?.tags || []).slice(0, 4);
      const catCls = `cat-${inf.category}`;
      const catLabel = CAT_LABEL[inf.category] || inf.category;
      const initials = getInitials(inf.name);

      return `
        <div class="tweet-card importance-${importance}" onclick="window.open('${tweet.url}','_blank')">
          <div class="card-header">
            <div class="avatar" id="av-${inf.id}">
              <img src="${inf.avatar}" alt="${initials}"
                   onerror="this.style.display='none'; document.getElementById('av-${inf.id}').textContent='${initials}'" />
            </div>
            <div class="user-info">
              <div class="user-name">${inf.name}</div>
              <div class="user-title">${inf.title_zh}</div>
            </div>
            <span class="category-badge ${catCls}">${catLabel}</span>
          </div>

          <p class="tweet-text">${escHtml(tweet.text)}</p>

          ${summary ? `
          <div class="divider"></div>
          <div class="summary-label">AI 中文摘要</div>
          <p class="summary-text">${escHtml(summary)}</p>
          ` : ''}

          ${tags.length ? `
          <div class="card-tags">
            ${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
          </div>` : ''}

          <div class="card-footer">
            <div class="engagement">
              <span class="eng-item">❤️ ${fmtNumber(tweet.likes)}</span>
              <span class="eng-item">🔁 ${fmtNumber(tweet.retweets)}</span>
              <span class="eng-item">💬 ${fmtNumber(tweet.replies)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="tweet-time">${timeAgo(tweet.created_at)}</span>
              <span class="open-link">查看 ↗</span>
            </div>
          </div>
        </div>`;
    }

    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Filter & Render ────────────────────────────────────────────
    function applyFilters() {
      let filtered = state.tweets;

      if (state.currentCategory !== 'all') {
        filtered = filtered.filter(t => t.influencer.category === state.currentCategory);
      }

      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(t =>
          t.tweet.text.toLowerCase().includes(q) ||
          t.influencer.name.toLowerCase().includes(q) ||
          (t.analysis?.summary_zh || '').toLowerCase().includes(q) ||
          (t.analysis?.tags || []).some(tag => tag.toLowerCase().includes(q))
        );
      }

      state.filteredTweets = filtered;
      renderTweets();
    }

    function renderTweets() {
      const container = document.getElementById('tweetsContainer');
      const count = document.getElementById('tweetCount');
      count.textContent = `${state.filteredTweets.length} 条`;

      if (!state.filteredTweets.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">暂无相关推文</div>
            <p style="color:var(--text-muted);font-size:13px;margin-top:8px">尝试切换分类或清空搜索</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="tweets-grid">
          ${state.filteredTweets.map(renderTweetCard).join('')}
        </div>`;
    }

    function filterByCategory(cat, btn) {
      state.currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function filterBySearch() {
      state.searchQuery = document.getElementById('searchInput').value;
      applyFilters();
    }

    // ── Data Loading ───────────────────────────────────────────────
    async function loadTweets() {
      try {
        const res = await fetch(API('/tweets'));
        const data = await res.json();
        state.tweets = data.tweets || [];

        if (data.updated_at) {
          const el = document.getElementById('lastUpdated');
          el.textContent = '更新: ' + timeAgo(data.updated_at);
          el.style.display = 'inline';
        }

        document.getElementById('loadingSkeletons')?.remove();
        applyFilters();
      } catch (e) {
        console.error('Failed to load tweets:', e);
        document.getElementById('tweetsContainer').innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">加载失败，请刷新重试</div></div>';
      }
    }

    async function loadDigest() {
      const container = document.getElementById('digestContainer');
      container.innerHTML = '<div class="skeleton" style="height:320px;border-radius:20px"></div>';
      try {
        const res = await fetch(API('/digest'));
        const data = await res.json();
        container.innerHTML = renderDigest(data);
      } catch (e) {
        container.innerHTML = renderDigest(null);
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(API('/stats'));
        const d = await res.json();
        document.getElementById('statTweets').textContent = d.total_tweets || 0;
        document.getElementById('statInfluencers').textContent = d.total_influencers || 0;
        document.getElementById('statEngagement').textContent = fmtNumber(d.total_engagement || 0);
        document.getElementById('statDigests').textContent = d.digests_available || 0;
        document.getElementById('statsBar').style.display = 'flex';
      } catch (e) {}
    }

    async function refreshData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      btn.disabled = true;
      showToast('🔄 正在刷新数据...');
      try {
        await fetch(API('/refresh'), { method: 'POST' });
        // Wait a moment then reload
        await new Promise(r => setTimeout(r, 3000));
        await Promise.all([loadTweets(), loadDigest(), loadStats()]);
        showToast('✅ 数据已更新');
      } catch (e) {
        showToast('❌ 刷新失败，请重试');
      } finally {
        btn.classList.remove('spinning');
        btn.disabled = false;
      }
    }

    // ── Init ───────────────────────────────────────────────────────
    function init() {
      // Set header date
      const now = new Date();
      document.getElementById('headerDate').textContent =
        now.getFullYear() + '年' +
        String(now.getMonth()+1).padStart(2,'0') + '月' +
        String(now.getDate()).padStart(2,'0') + '日';

      // Load data
      Promise.all([loadTweets(), loadDigest(), loadStats()]);
    }

    init();
  </script>
</body>
</html>
